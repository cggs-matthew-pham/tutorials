summary: Students send a message as numbered packets through a small network, see packets take different routes, arrive out of order and get lost, and see TCP's acknowledgements bring the missing one back (AC9TDI8K02 node 2).
time: 40
timing: "Predict and Try 6 min · Worked example 12 min · Vary 12 min · Practise and Make 10 min"
goals:
  - I can explain why data is sent in packets.
  - I can describe what happens when a packet is lost.
  - I can explain how TCP gets the whole message there in order.
struggle: "Students expect the network to be one pipe. Keep pointing at the numbers on the packets: each one makes its own trip."
before: |
  Try the Try and Vary boards yourself. A paper version works well first: cut a sentence into numbered strips, hand them out across the room, and have students pass them to a "receiver", with one strip "lost" on the way.

  Simplifications: real packets carry about 1500 bytes, and real TCP uses acknowledgement numbers and timers; the board waits until everything else has arrived before asking again. Router C is set to be busy (slow, and it loses the second packet).

  Links: Secret messages' checksum lesson is how a receiver tells a packet was damaged.
running:
  - "Predict: students who chose \"always in order\" picture one pipe; let the Try surprise them."
  - "Try: ask why packet 2 came last."
  - "Worked example: before the TCP line, ask how the receiver could know something is missing."
  - "Vary: ask why a network has spare links."
  - "Make: compare: did anyone find a different link to break?"
stuck:
  - see: "A student says the whole message is resent (Sam's mistake)."
    ask: "Which packets did your friend confirm?"
    fix: "Only the unconfirmed one is sent again."
  - see: "A student thinks the routers reorder packets."
    ask: "Where do the packets get put back in order?"
    fix: "At the receiver, using the numbers."
stretch: "Video calls often use UDP, which never resends lost packets. Why might that be better for a live call than waiting for a resend?"
support: "Give the five words with a picture each: packet, number, router, route, acknowledgement."
leads: |
  Next: Who can see your data? (packets pass through routers you don't control).

  Code links: micro:bit radio sends short packets; Secret messages adds checksums to them.
exit:
  q: "A message is split into 5 packets and packet 3 is lost. What does TCP do, and how does the message end up in order?"
  a: "The receiver never confirms packet 3, so the sender sends it again. The receiver puts the packets in order by their numbers."
explain: |
  Data is sent in small **packets**. Each carries a piece of the data, a **number** and an address. **Routers** pass each packet on, so packets can take different routes, arrive out of order or get lost at a busy router.

  The **TCP** protocol has the receiver confirm (acknowledge) each packet. Any packet that isn't confirmed is sent again, and the numbers put the message back in order.
