summary: Students put a menu inside while True, choose with if and elif, leave with break, and test the app against a table of cases. The Make task is a small app of their own, tested with cases they write.
time: 55
timing: "Predict and Run 10 min · Investigate 15 min · Modify 10 min · Make 20 min"
goals:
  - I can build a menu with while True, if and elif, and leave it with break.
  - I can write test cases (what to type and what should be printed) and use them to check a program.
  - I can plan and build a small text app of my own.
before: |
  Read the unit primer first. `while True:` asks a question whose answer is always yes, so the loop runs until `break` leaves it. Each lap shows the menu (a function, `show_menu()`), asks for a choice and runs one branch. The bug task returns to last lesson's surprise: `input()` gives text, so `choice == 1` is never true; compare with `"1"`. The **test case** table is the new habit: what you type, and the output you expect, written **before** running. It is the "validate programs against a range of test cases" idea from the Years 9–10 curriculum, met here in a small form.
running:
  - "Predict: walk the four inputs on the board, keeping the total in a box that changes."
  - "Run: ask students to try to break it: letters, an empty answer, 10. The else catches them all."
  - "Investigate: fill in the test cases before running, then run them. Ask which case they would never have thought to try."
  - "Bug task: ask what type of thing choice is. Show print(choice == 1) and print(choice == \"1\") in the playground."
  - "Make: insist on paper plans (menu choices and three test cases) before typing. Swap apps and run each other's test cases."
stuck:
  - see: Every choice gives the else message.
    ask: Is the choice compared with text ("1") or a number (1)?
    fix: "Compare with text: if choice == \"1\":."
  - see: The menu never stops.
    ask: Which choice reaches break? Is break indented inside that elif?
    fix: Put break as the last line inside the quit choice's branch.
  - see: The total resets every lap.
    ask: Where is total = 0, before the loop or inside it?
    fix: Set the starting total before while True, so the loop does not reset it.
stretch: Add a running list of what was ordered (a list and .append()), and print it with the total when paying.
support: Give students the till as a starter for their own app and ask them to change the choices, prices and messages first, then add one new choice.
leads: "This completes Python foundations. The extensions build on this program shape: Objects with turtles (many enemies in a game), Data detective (real data sets), and Apps, where the menu becomes buttons (Gradio). Class ideas: a canteen till; a revision quiz for another subject; a unit converter for a science practical."
exit:
  q: "In the till, what would happen if break were missing from the pay choice?"
  a: "The total is printed, then the loop carries on and shows the menu again, for ever, because nothing else leaves while True."
explain: |
  1. `while True:` repeats for ever, so the way out is `break`, which leaves the loop at once.
  2. Inside the loop: show the menu, ask with `input()`, then run one branch with `if` and `elif`. The answer is text, so compare with `"1"`, not `1`.
  3. A **test case** is what you type and what you expect to see. Write them before you run, including a wrong choice, then check each one.
solutions:
  step-4#t1: menu.py#sol-sandwich
  step-4#t2: menu.py#sol-cancel
  step-5#t1: menu.py#sol-app
struggle: "Writing expected outputs before running, and comparing a choice with \"1\" rather than 1. Ask what they expect for each input first; don't run it for them."
