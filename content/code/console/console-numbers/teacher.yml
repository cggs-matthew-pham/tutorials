summary: Students find out that input() always gives back text, turn it into a number with int(), and check it first with isdigit() so a typo gets a helpful reply instead of a crash.
time: 45
timing: "Predict and Run 10 min · Investigate 15 min · Modify 10 min · Make 10 min"
goals:
  - I can explain why input() gives back text, even when digits are typed.
  - I can turn text into a number with int() and calculate with it.
  - I can check an answer with isdigit() before turning it into a number.
before: |
  Read the unit primer first. The surprise of the lesson: with no `int()`, typing 5 and 5 prints 55, because both answers are text and `+` joins text. `int("5")` is the number 5. `int("twelve")` stops the program with a ValueError, so programs check the text first: `text.isdigit()` is True only if every character is a digit 0 to 9 (so `-3` and `2.5` are False, which suits ages and ticket counts). The dot in `text.isdigit()` means "ask this text a question"; students met the same dot in `random.randint` in Catch the turtle.
running:
  - "Predict: most students say 10. Let the 55 land, then ask: what kind of thing does input() give back?"
  - "Run: change both lines to use int() and run again with the same answers. Keep both versions on the board side by side."
  - "Investigate: do the trace before running. The -3 row surprises students: a minus sign is not a digit."
  - "Bug task: text times a number repeats the text. Python is not wrong; it was given text."
  - "Make: insist on the three tests (3, 0, three). Testing with a wrong answer on purpose is the habit this lesson builds."
stuck:
  - see: "ValueError: invalid literal for int() with base 10."
    ask: What did you type, and is every character a digit?
    fix: Check the text with isdigit() before int(), and reply with a message in the else.
  - see: Numbers are joined instead of added, such as 55.
    ask: Has the text been turned into a number yet?
    fix: Wrap the input in int() (after checking it), then add.
  - see: "TypeError when printing the result."
    ask: Is the number being joined onto text?
    fix: "Turn the number back into text with str() to join it: \"Total: \" + str(total)."
stretch: Let the ticket machine offer a child price ($8) and an adult price ($12), asking for the number of each, and print the total.
support: Give students the if and else lines of the ticket machine and ask them to fill in the calculation and the two print lines.
leads: "Next lesson uses while to keep asking, so a program can ask again after a bad answer and keep a running total. Class ideas: a canteen price calculator; a converter for a science practical (minutes to seconds)."
exit:
  q: "a = input(\"Number: \") and you type 7. What does print(a * 2) show, and why?"
  a: "77. a is the text \"7\", and text times 2 repeats it. int(a) * 2 would give 14."
explain: |
  1. `input()` always gives back **text**. Typing 5 gives `"5"`, so `"5" + "5"` joins into `"55"`.
  2. `int(text)` turns text made of digits into a whole number. Then `+` adds: 5 + 5 is 10.
  3. `int("twelve")` stops with an error, so check first: `text.isdigit()` is True only when every character is a digit. Use it in an `if`, with a helpful message in the `else`.
solutions:
  step-4#t1: numbers.py#sol-ten
  step-4#t2: numbers.py#sol-sum
  step-5: numbers.py#sol-tickets
