activities:
  - at: start
    kind: info
    title: "By the end of this lesson"
    do: |
      Here is the finished program running. By the end of the lesson you will write one like it.
    notes: "Run the finished example on the projector before anything else."
  - at: predict
    kind: discussion
    title: "Vote on the polygon"
    minutes: 3
    do: |
      Decide with your partner. Hold up 1, 2, 3 or 4 fingers for the option you chose.
    notes: "The wrong options are two slips: a name that copies later changes, and the turn left at 90."
  - at: investigate
    title: "Be the computer"
    minutes: 5
    do: |
      Students hold cards for sides, size and colour. Change one card; the class says which drawing changes.
    notes: "Make the idea physical before it goes back to the screen."
  - at: end
    title: Show a friend
    minutes: 3
    do: |
      Turn to the next pair. Show your generator, then change one name and predict the result.
