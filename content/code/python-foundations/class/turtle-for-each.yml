activities:
  - at: start
    kind: info
    title: "By the end of this lesson"
    do: |
      Here is the finished program running. By the end of the lesson you will write one like it.
    notes: "Run the finished example on the projector before anything else."
  - at: predict
    kind: discussion
    title: "Vote on what c holds"
    minutes: 3
    do: |
      Decide with your partner. Hold up 1, 2, 3 or 4 fingers for the option you chose.
    notes: "Wrong options: the place number, the whole list, nothing."
  - at: investigate
    title: "Visit each"
    minutes: 5
    do: |
      One student walks along a row of colour cards and says what c holds at each. Compare with the index version from last lesson.
    notes: "Make the idea physical before it goes back to the screen."
  - at: end
    title: Show a friend
    minutes: 3
    do: |
      Turn to the next pair. Show your bar chart and say what h holds on pass 2.
