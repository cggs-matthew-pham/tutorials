summary: Students meet the turtle, read a short program that follows its commands in order, and learn that the order is the picture.
time: 35
timing: "Meet the commands 8 min · Predict and Run 7 min · Put the lines in order 8 min · Make 12 min"
goals:
  - I can say what forward and right do to the turtle.
  - I can say why the order of the commands matters.
  - I can write a program of several commands that draws a shape.
before: |
  Run the first program and draw the square yourself. It takes two minutes.
running:
  - "Meet the commands: you explain, at the board. Run the three lines live, one at a time. Say what forward and right do, and that right does not move the turtle."
  - "Predict: show the three-line program and take a vote before anyone runs it. The wrong options are two slips: thinking right(90) draws or moves 90 steps, and thinking the order does not matter."
  - "Run: run it on the slide, then students run it themselves. Ask: did the turn draw anything?"
  - "Put the lines in order: students do the ordering on their own screens. Circulate; if a student is stuck, ask which way the turtle is facing after the first turn."
  - "Make: the square. Hints are in the speaker notes. If the room is unsure, model one side on the board and let students write the rest."
stuck:
  - see: The turtle draws a line where the student expected a turn.
    ask: Does right(90) move the turtle, or only turn it?
    fix: right turns the turtle on the spot. Only forward draws.
  - see: The shape comes out in the wrong order or looks mixed up.
    ask: Read the lines aloud in order, as if you were the turtle. Where does it face after each turn?
    fix: Each line happens after the one above it, and each turn changes which way forward goes.
  - see: A NameError or "forward is not defined".
    ask: What is the first line of your program?
    fix: Every program starts with from turtle import *. Copy it to the top.
stretch: Make a rectangle, with two side lengths. How many different numbers do you need?
support: Give the first side and turn, and ask the student to add the other three.
leads: "Next lesson: the same square, but the eight lines become three. Then variables, so the numbers can be worked out instead of guessed."
exit:
  q: "A turtle runs forward(100), right(90), forward(50). How many lines does it draw, and which is longer, the first or the second?"
  a: "Two lines (the turn does not draw). The first is longer: 100 steps against 50."
explain: |
  A program is a list of commands the computer follows in order, from the top down. `forward(100)` moves the turtle 100 steps and draws a line. `right(90)` turns it on the spot, a quarter of a full turn; it does not move or draw. `left(90)` turns the other way.

  Because each turn changes the way the turtle faces, the order of the commands is the picture. Swapping two lines gives a different drawing.

  The first line, `from turtle import *`, gives a program the turtle commands. Students copy it for now; Functions and Modules explain how it works.
solutions:
  step-5: square.py#sol-square
struggle: "Remembering that right turns without drawing. Ask what the turtle did on that line, instead of telling them."
