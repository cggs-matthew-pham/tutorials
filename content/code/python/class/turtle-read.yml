activities:
  - at: start
    kind: info
    title: "By the end of this lesson"
    do: |
      Here is the finished program running. By the end of the lesson you will write one like it.
    notes: "Run the finished example on the projector before anything else."
  - at: predict
    kind: discussion
    title: "Vote on the stem"
    minutes: 3
    do: |
      Decide with your partner. Hold up 1, 2, 3 or 4 fingers for the option you chose.
    notes: "The stem uses the counter. Ask what i is on the third pass."
  - at: investigate
    title: "Highlight the jobs"
    minutes: 5
    do: |
      Pairs colour the garden lines on paper: stem, head, spacing, decision. Compare with the next pair.
    notes: "Make the idea physical before it goes back to the screen."
  - at: end
    title: Show a friend
    minutes: 3
    do: |
      Turn to the next pair. Say which part you changed and which parts you left alone.
