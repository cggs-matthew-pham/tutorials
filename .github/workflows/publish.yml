name: Build and publish (manual)

# Runs only when started by hand: Actions tab > Build and publish (manual) > Run workflow.
# No push, schedule or other trigger on purpose. It builds main, reusing every clip and picture already
# on the live site, records and draws only what is new (real Emma voice, MakeCode pictures), and publishes
# the finished site to the gh-pages branch, which Pages serves.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  SITE: https://cggs-matthew-pham.github.io/tutorials

jobs:
  publish:
    runs-on: ubuntu-latest
    # A full redraw and re-record is about 20 to 60 minutes (the first run after a long gap is slowest); past this something is stuck.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install site tools
        run: npm ci --omit=optional   # skip the sandbox-only bundled Chromium

      - name: Validate lessons
        run: npm run validate

      # Clips and pictures whose hash matches the published one are downloaded from the live site.
      - name: Fetch unchanged clips and pictures
        id: reuse
        run: |
          node tools/build-playground.mjs
          node tools/render-pictures.mjs --seed "$SITE" --check
          node tools/render.mjs --seed "$SITE" --check

      - name: Install browser and ffmpeg
        if: steps.reuse.outputs.stale != '0' || steps.reuse.outputs.pictures_stale != '0'
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install lesson dependencies
        if: steps.reuse.outputs.stale != '0'
        run: |
          for f in $(find content -name requirements.txt); do
            [ -f "$f" ] && pip install -r "$f"
          done
          for f in $(find content -name package.json -not -path '*/node_modules/*'); do
            (cd "$(dirname "$f")" && npm ci)
          done
          # Voiceover (lessons with voice:): Kokoro runs in Node; not a site dependency, so install it only here.
          if grep -rlq '^voice:' content --include=lesson.md; then npm install --no-save --no-audit --no-fund kokoro-js@1.2.1; fi

      # Save progress: after 125 minutes nothing new is started, so the build and publish below still fit in the job's
      # 150. What is done is published; what is left keeps the live version and is done by the next run (the run's
      # summary says how much is left).
      - name: Render new clips and pictures
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export WP_DEADLINE=$(( $(date +%s) + 125 * 60 )) WP_LIVE_SITE="$SITE"
          # Snapshots: every 30 minutes, publish what is done so far, so a crash or a cancel loses at most 30 minutes.
          # Each snapshot is built in a copy (the live site, with this run's work laid over it), never in dist/, so it
          # does not disturb the recording; anything not redone yet keeps its live version.
          mkdir -p ../live
          git fetch -q --depth 1 origin gh-pages && git archive FETCH_HEAD | tar -x -C ../live || echo "no live site to start from"
          snapshot() {
            rm -rf ../snap && cp -r ../live ../snap && cp -r dist/. ../snap/ \
              && node tools/build-site.mjs --out ../snap > ../snap.log 2>&1 && touch ../snap/.nojekyll \
              && (cd ../snap && git init -q -b gh-pages && git add -A \
                  && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Snapshot of build from ${GITHUB_SHA::7} (in progress)" \
                  && git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages) \
              && echo "::notice::Snapshot published at $(date -u +%H:%M) UTC" || { echo "::warning::Snapshot failed"; tail -5 ../snap.log; }
          }
          ( while sleep 1800; do snapshot; done ) &
          SNAP=$!
          npm run render
          kill $SNAP 2>/dev/null || true

      - name: Build site
        run: npm run build

      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
